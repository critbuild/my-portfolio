<title id="fy-t">Fairy — orbital core</title>
<desc id="fy-d">A vivid orange core ringed by sharp white and orange orbits on black. Three input lines converge into the core from the left and a single line leads out to a stacked memory mark on the right, framed by fine interface ticks and corner brackets.</desc>
