<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="crit-t crit-d">
<title id="crit-t">Crit — a trunk, three worktrees, three isolated panes</title>
<desc id="crit-d">A vertical commit line on the left branches into three parallel lanes. Each lane ends in its own terminal pane stacked on the right; the middle pane is active and brighter. Past a dashed boundary, each pane owns a small sealed container box with its own port tick, framed by fine interface ticks and corner brackets.</desc>
